name: Keiba Backfill

# 手動実行 + 毎日 AM3:00 UTC（JST 12:00）に自動実行
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 745件 × 1秒 = 約13分 → 余裕を持って60分

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # @supabase/supabase-js は package.json の dependencies に既に含まれている
      - name: Install dependencies
        run: npm ci

      - name: Run keiba backfill
        run: node scripts/keiba-backfill.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
